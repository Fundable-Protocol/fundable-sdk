name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing-capable npm
        run: npm install --global "npm@^11.15.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:verify
      - name: Verify release tag
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) process.exit(1)"
      - name: Publish package
        run: |
          DIST_TAG=$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version.includes('-') ? 'next' : 'latest')")
          npm publish --access public --tag "$DIST_TAG"
